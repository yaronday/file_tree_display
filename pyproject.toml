[project]
name = "file_tree_display"
dynamic = ["version"]
authors = [
  { name="Yaron Dayan", email="griffon26base@gmail.com" },
]
license = "MIT"

description = "A utility for generating a visually structured directory tree."
readme = "README.md"

requires-python = ">=3.11"

keywords = [
  "dev tools",
  "file-tree",
  "directory-tree",
  "directory-listing",
  "file-system",
  "ascii-tree",
  "tree-view",
  "cli",
  "cli-tool",
  "command-line",
  "terminal",
  "developer-utilities",
  "visualization"
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Terminals",
  "Topic :: Utilities",
]

dependencies = [
    "nano-dev-utils",
]

[project.urls]
Homepage = "https://github.com/yaronday/file_tree_display"
Issues = "https://github.com/yaronday/file_tree_display/issues"
license = "https://github.com/yaronday/file_tree_display/blob/master/LICENSE"

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=file_tree_display --cov-report=term-missing"

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
omit = [
    "src/file_tree_display/__version__.py"
]

[project.scripts]
ftd = "file_tree_display.__main__:main"

[dependency-groups]
dev = [
     "build>=1.6.1",
     "twine>=7.0.0",
	 "pre-commit>=4.7.0",
     "ruff",
     "pyright",
]
test = [
    "pytest",
    "pytest-mock",
    "pytest-asyncio",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/file_tree_display/__version__.py"
