[project]
name = "file_tree_display"
dynamic = ["version"]
authors = [
  { name="Yaron Dayan", email="griffon26base@gmail.com" },
]
license = "MIT"

description = "A utility for generating a visually structured directory tree."
readme = "README.md"

requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "nano-dev-utils",
]

[project.urls]
Homepage = "https://github.com/yaronday/file_tree_display"
Issues = "https://github.com/yaronday/file_tree_display/issues"
license = "https://github.com/yaronday/file_tree_display/blob/master/LICENSE"

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=file_tree_display --cov-report=term-missing"

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
omit = [
    "src/file_tree_display/__version__.py"
]

[project.scripts]
ftd = "file_tree_display.__main__:main"

[dependency-groups]
dev = [
     "build>=1.6.1",
     "twine>=7.0.0",
	 "pre-commit>=4.7.0",
     "ruff",
     "pyright",
]
test = [
    "pytest",
    "pytest-mock",
    "pytest-asyncio",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/file_tree_display/__version__.py"
